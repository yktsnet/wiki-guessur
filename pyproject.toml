[project]
name = "wiki-guessur"
version = "0.1.0"
description = "Mention vs identity: a regenerable benchmark on de-identified Wikipedia articles"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.0",
    "numpy>=1.26",
]

[project.scripts]
wiki-guessur = "wiki_guessur.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_guessur"]
