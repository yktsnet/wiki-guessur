# 素材は一度固定したら変えない。頑健さ評価の変動要因はシードのみ。
[dump]
date = "20260712"
base_url = "https://dumps.wikimedia.org/other/cirrus_search_index"
index = "jawiki_content"
shards = 14

[generate]
num_queries = 5000
min_incoming_links = 5
max_dummies = 9        # 候補数k = ダミー数+1 で 2〜10
max_doc_chars = 4000
min_doc_chars = 200

[eval]
train_ratio = 0.5

[llm]
model = "gemini-3.1-flash-lite"
gap_threshold = 0.1    # 上位2候補の正規化スコア差がこれ未満なら僅差ケース
sample_rate = 0.1
text_chars = 1200
rpm = 12               # 無料枠15RPMに対する安全側ペース
